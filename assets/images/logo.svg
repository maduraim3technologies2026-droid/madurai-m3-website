<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoM3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070D1E" />
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(4, 5)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logoBgGrad)" stroke="url(#logoBorder)" stroke-width="2" />
    <path d="M 16 44 L 16 20 L 22 20 L 22 44 Z" fill="#FFFFFF" />
    <path d="M 22 20 L 30 34 L 27 38 L 18 22 Z" fill="#CBD5E1" opacity="0.9" />
    <path d="M 30 34 L 38 20 L 42 23 L 33 38 Z" fill="#F97316" filter="url(#logoGlow)" />
    <path d="M 37 20 L 43 20 L 43 44 L 37 44 Z" fill="#FFFFFF" />
    
    <!-- 3 Badge -->
    <g transform="translate(42, 14) scale(0.48)">
      <path d="M 14 0 L 28 8 L 28 24 L 14 32 L 0 24 L 0 8 Z" fill="url(#logoM3Grad)" />
      <path d="M 9 9 C 12 7, 20 7, 20 12 C 20 14, 16 15, 13 15 C 18 15, 21 17, 21 21 C 21 25, 12 26, 8 23" 
            stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
    <circle cx="30" cy="34" r="2.5" fill="#FF6B35" />
  </g>

  <!-- Typography -->
  <g transform="translate(76, 24)">
    <!-- Primary Name -->
    <text x="0" y="8" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="1.5" fill="#FFFFFF">
      MADURAI <tspan fill="#F97316">M3</tspan>
    </text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="2.8" fill="#E2E8F0">
      TECHNOLOGIES
    </text>
    <!-- Tagline & Origin Pill -->
    <text x="0" y="39" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="8.5" letter-spacing="1.2" fill="#94A3B8">
      SOFTWARE &amp; IT SERVICES • MADURAI
    </text>
  </g>
</svg>
