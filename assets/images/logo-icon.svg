<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="m3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070D1E" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Subtle Grid Accent -->
  <path d="M 6 35 L 94 35 M 6 65 L 94 65 M 35 6 L 35 94 M 65 6 L 65 94" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Geometric 'M' with Orange Accent Peak -->
  <!-- Left Pillar -->
  <path d="M 24 68 L 24 32 L 32 32 L 32 68 Z" fill="#FFFFFF" />
  <!-- Center Diagonal to V -->
  <path d="M 32 32 L 44 52 L 40 58 L 26 36 Z" fill="#CBD5E1" opacity="0.9" />
  <!-- Right Diagonal from Peak -->
  <path d="M 44 52 L 56 32 L 62 36 L 48 58 Z" fill="#F97316" filter="url(#glow)" />
  <!-- Right Pillar of M -->
  <path d="M 54 32 L 62 32 L 62 68 L 54 68 Z" fill="#FFFFFF" />

  <!-- Superset '3' / Cubed Icon Badge in High-tech Orange -->
  <g transform="translate(62, 24) scale(0.65)">
    <!-- Tech Badge Hexagon -->
    <path d="M 16 0 L 32 9 L 32 27 L 16 36 L 0 27 L 0 9 Z" fill="url(#m3Grad)" />
    <!-- '3' Character -->
    <path d="M 10 10 C 13 8, 22 8, 22 13 C 22 16, 18 17, 15 17 C 20 17, 23 19, 23 23 C 23 28, 13 29, 9 26" 
          stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- High-tech Node Pulse Dot -->
  <circle cx="44" cy="52" r="3.5" fill="#FF6B35" filter="url(#glow)" />
</svg>
